name: Build Windows x64 release packages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-windows-custom.yml"
      - ".gitattributes"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "mobile/link/**"
      - "third_party/**"
      - "integrations/**"
      - "pebrel_app/**"
      - "pebrel_settings/**"
      - "pebrel_hook/**"
      - "pebrel_terminal/**"
      - "pebrel_config/**"
      - "pebrel_config_derive/**"
      - "pebrel-completions/**"
      - "pebrel_gpui/**"
      - "pebrel_split/**"
      - "scripts/**"
      - "assets/**"
      - "docs/**"
      - "README*"
      - "LICENSE*"
      - "THIRD-PARTY-NOTICES"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/build-windows-custom.yml"
      - ".gitattributes"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "mobile/link/**"
      - "third_party/**"
      - "integrations/**"
      - "pebrel_app/**"
      - "pebrel_settings/**"
      - "pebrel_hook/**"
      - "pebrel_terminal/**"
      - "pebrel_config/**"
      - "pebrel_config_derive/**"
      - "pebrel-completions/**"
      - "pebrel_gpui/**"
      - "pebrel_split/**"
      - "scripts/**"
      - "assets/**"
      - "docs/**"
      - "README*"
      - "LICENSE*"
      - "THIRD-PARTY-NOTICES"
  workflow_dispatch:
    inputs:
      package_version:
        description: Pebrel version to package (must match pebrel_app/Cargo.toml)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: pebrel-windows-x64
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.97.1"
  PYTHONUTF8: "1"

jobs:
  source-validation:
    name: Source validation (metadata, bridge, nightly format)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout standalone Pebrel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Validate Cargo workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1
      - name: Test DeepSeek Harness bridge
        run: npm test --prefix integrations/deepseek-harness-bridge
      - name: Install pinned nightly rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-20
          components: rustfmt
      - name: Report pinned formatter versions
        run: |
          rustc --version --verbose
          cargo +nightly-2026-11-20 fmt --version
      - name: Verify changed Rust files with pinned nightly rustfmt (read-only)
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Pull-request payloads do not have github.event.before; compare the
          # complete PR against its base instead of checking only HEAD^.
          base="$PR_BASE_SHA"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]]; then
            base="$BASE_SHA"
          fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git merge-base origin/main "$GITHUB_SHA")"
            if [[ "$base" == "$GITHUB_SHA" ]]; then
              base="$(git rev-parse HEAD^)"
            fi
          fi
          mapfile -t rust_files < <(git diff --diff-filter=ACMRT --name-only "$base" "$GITHUB_SHA" -- '*.rs')
          if (( ${#rust_files[@]} == 0 )); then
            echo "No Rust source files changed in this commit; skipping the changed-file format check."
            exit 0
          fi
          printf 'Checking %s changed Rust file(s)\n' "${#rust_files[@]}"
          rustfmt +nightly-2026-11-20 --check --edition 2024 --config skip_children=true "${rust_files[@]}"

  windows-x64:
    # Only a manual release dispatch may consume a Windows runner. Pull requests
    # run the Linux metadata/bridge/format gate above and never use Windows quota.
    if: github.event_name == 'workflow_dispatch'
    name: Build and verify Windows x64 packages
    runs-on: windows-2022
    needs: source-validation
    timeout-minutes: 150
    steps:
      - name: Checkout standalone Pebrel source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Validate Cargo workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1
      - name: Run full Windows workspace regression tests
        run: cargo test --workspace --all-targets --locked
      - name: Run GPUI settings interaction tests
        run: cargo test -p pebrel --features gpui-test-support --lib --locked
      - name: Test DeepSeek Harness bridge
        run: npm test --prefix integrations/deepseek-harness-bridge
      - name: Validate package version
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          $manifest = Get-Content pebrel_app/Cargo.toml -Raw -Encoding UTF8
          $match = [regex]::Match($manifest, '(?m)^version\s*=\s*"(?<version>[0-9]+\.[0-9]+\.[0-9]+)"\s*$')
          if (-not $match.Success) { throw 'Unable to read package version from pebrel_app/Cargo.toml.' }
          if ([string]::IsNullOrWhiteSpace($env:PACKAGE_VERSION)) {
            $env:PACKAGE_VERSION = $match.Groups['version'].Value
          }
          if ($env:PACKAGE_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$' -or $match.Groups['version'].Value -ne $env:PACKAGE_VERSION) {
            throw 'Package version must match pebrel_app/Cargo.toml.'
          }
          "PACKAGE_VERSION=$env:PACKAGE_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Prepare Windows console runtime
        shell: pwsh
        run: ./scripts/prepare-windows-runtime.ps1 -Destination assets/windows/conhost
      - name: Build GPUI application and runtime helper (single build)
        shell: pwsh
        run: ./scripts/build-windows-product.ps1 -Configuration release -TargetDirectory target
      - name: Test Windows package manifest and architecture guards
        shell: pwsh
        run: ./scripts/tests/package-release.tests.ps1 -TargetDirectory target
      - name: Validate installer inputs before compilation
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version $env:PACKAGE_VERSION -PackageBrand Pebrel -OutputDirectory dist -TargetDirectory target -SkipBuild -ValidateOnly
      - name: Package portable ZIP
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version $env:PACKAGE_VERSION -PackageBrand Pebrel -OutputDirectory dist -TargetDirectory target -SkipBuild -Force
      - name: Build installer EXE
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version $env:PACKAGE_VERSION -PackageBrand Pebrel -OutputDirectory dist -TargetDirectory target -SkipBuild -Force
      - name: Smoke-test portable ZIP and installer lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD "dist/Pebrel-v$env:PACKAGE_VERSION-windows-x64.zip"
          $setup = Join-Path $PWD "dist/Pebrel-v$env:PACKAGE_VERSION-windows-x64-setup.exe"
          foreach ($file in @($zip, $setup)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release artifact: $file" }
            if ((Get-Item -LiteralPath $file).Length -lt 1MB) { throw "Release artifact is unexpectedly small: $file" }
          }
          $root = Join-Path $env:TEMP ("pebrel-release-smoke-" + [guid]::NewGuid().ToString('N'))
          $portable = Join-Path $root 'portable'
          $installed = Join-Path $root 'installed'
          New-Item -ItemType Directory -Path $portable, $installed -Force | Out-Null
          try {
            Expand-Archive -LiteralPath $zip -DestinationPath $portable
            foreach ($relative in @('pebrel.exe', 'pebrel.com', 'runtime/pebrel-hook.exe', 'runtime/conpty.dll', 'runtime/OpenConsole.exe')) {
              if (-not (Test-Path -LiteralPath (Join-Path $portable $relative) -PathType Leaf)) { throw "Portable ZIP is missing $relative" }
            }
            $portableVersion = & (Join-Path $portable 'pebrel.exe') --version 2>&1 | Out-String
            if ($portableVersion -notmatch [regex]::Escape($env:PACKAGE_VERSION)) { throw "Portable executable version mismatch: $portableVersion" }
            $installLog = Join-Path $root 'install.log'
            $installArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$installed", "/LOG=$installLog")
            $process = Start-Process -FilePath $setup -ArgumentList $installArgs -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode). See $installLog" }
            foreach ($relative in @('pebrel.exe', 'pebrel.com', 'runtime/pebrel-hook.exe', 'runtime/conpty.dll', 'runtime/OpenConsole.exe')) {
              if (-not (Test-Path -LiteralPath (Join-Path $installed $relative) -PathType Leaf)) { throw "Installed application is missing $relative" }
            }
            $installedVersion = & (Join-Path $installed 'pebrel.exe') --version 2>&1 | Out-String
            if ($installedVersion -notmatch [regex]::Escape($env:PACKAGE_VERSION)) { throw "Installed executable version mismatch: $installedVersion" }
            $uninstaller = Join-Path $installed 'unins000.exe'
            if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw 'Inno Setup uninstaller was not created' }
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
            if (Test-Path -LiteralPath (Join-Path $installed 'pebrel.exe')) { throw 'Uninstall smoke test left pebrel.exe behind' }
          } finally {
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          }
          Get-FileHash -LiteralPath $zip -Algorithm SHA256
          Get-FileHash -LiteralPath $setup -Algorithm SHA256
      - name: Upload Windows x64 packages
        uses: actions/upload-artifact@v4
        with:
          name: pebrel-windows-x64
          path: |
            dist/Pebrel-v*-windows-x64.zip
            dist/Pebrel-v*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 30
