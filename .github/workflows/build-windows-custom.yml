name: Build Windows package (custom)

on:
  push:
    branches:
      - ai-api-deepseek-hook-markdown
  workflow_dispatch:
    inputs:
      package_version:
        description: Optional version label (defaults to pebrel_app/Cargo.toml)
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.97.1"
  PYTHONUTF8: "1"

jobs:
  windows-x64:
    name: Build Pebrel for Windows x64
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Resolve and validate package version
        id: package_version
        shell: pwsh
        env:
          PACKAGE_VERSION_INPUT: ${{ steps.package_version.outputs.value }}
        run: |
          $manifest = Get-Content pebrel_app/Cargo.toml -Raw -Encoding UTF8
          $match = [regex]::Match($manifest, '(?m)^version\s*=\s*"(?<version>[0-9]+\.[0-9]+\.[0-9]+)"\s*$')
          if (-not $match.Success) {
            throw 'Could not read the package version from pebrel_app/Cargo.toml.'
          }
          $manifestVersion = $match.Groups['version'].Value
          $version = if ([string]::IsNullOrWhiteSpace($env:PACKAGE_VERSION_INPUT)) { $manifestVersion } else { $env:PACKAGE_VERSION_INPUT.Trim() }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$' -or $version -ne $manifestVersion) {
            throw ('The package version must exactly match pebrel_app/Cargo.toml (' + $manifestVersion + ').')
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Prepare Windows console runtime
        shell: pwsh
        run: ./scripts/prepare-windows-runtime.ps1 -Destination assets/windows/conhost
      - name: Build GPUI application and runtime helper
        shell: pwsh
        run: ./scripts/build-windows-product.ps1 -Configuration release -TargetDirectory target
      - name: Package portable ZIP
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.value }}
        run: ./scripts/package-release.ps1 -Version $env:PACKAGE_VERSION -PackageBrand Pebrel -OutputDirectory dist -TargetDirectory target -Force
      - name: Build installer EXE
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.value }}
        run: ./scripts/build-installer.ps1 -Version $env:PACKAGE_VERSION -PackageBrand Pebrel -OutputDirectory dist -TargetDirectory target -Force
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: pebrel-windows-x64
          path: |
            dist/Pebrel-v${{ steps.package_version.outputs.value }}-windows-x64.zip
            dist/Pebrel-v${{ steps.package_version.outputs.value }}-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14
